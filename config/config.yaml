# ==============================================================================
# ROOSTOO AUTONOMOUS QUANT TRADING BOT - PRODUCTION CONFIGURATION
# ==============================================================================

exchange:
  name: "roostoo_mock"
  base_url: "https://mock-api.roostoo.com"
  requests_per_second: 5.0
  burst_capacity: 10
  timeout_seconds: 5.0
  max_retries: 4
  retry_base_delay: 0.5
  retry_max_delay: 8.0

portfolio:
  initial_capital: 50000.0
  min_cash_reserve_pct: 0.05       # 5% cash reserve constraint
  max_gross_exposure_pct: 1.00     # 100% maximum gross exposure (no leverage)
  max_risk_per_trade_pct: 0.01     # 1.0% maximum risk per trade
  max_open_positions: 2            # Maximum simultaneous active positions
  max_position_notional_pct: 0.50  # No single position exceeds 50% equity

risk_controls:
  rolling_24h_drawdown_limit: 0.035  # 3.5% rolling 24h drawdown circuit breaker
  freeze_duration_hours: 6.0         # 6 hours cooling freeze on 3.5% drawdown
  max_drawdown_limit: 0.06           # 6.0% maximum peak-to-trough circuit breaker
  enforce_circuit_breakers: true

risk_governor:
  enabled: true
  trade_frequency:
    enabled: true
    minimum_hold_seconds: 300
    minimum_seconds_between_same_symbol_entries: 300
    cooldown_after_loss_seconds: 900
    cooldown_after_profit_seconds: 120
  signal_freshness:
    enabled: true
    require_reset_before_reentry: true
    max_signal_age_seconds: 300
  expected_edge:
    enabled: true
    min_edge_pct: 0.0040             # 40 bps (0.40%) minimum gross edge
    fee_slippage_buffer_pct: 0.0016  # 16 bps buffer above round-trip fees
    min_risk_reward: 1.5
  position_sizing:
    enabled: true
    base_risk_per_trade_pct: 0.010   # 1.0% equity risk
    max_major_position_pct: 0.50     # 50% max for BTC/ETH (aligns with portfolio cap)
    max_alt_position_pct: 0.25       # 25% max for altcoins
    quality_scaling_enabled: true
    regime_scaling_enabled: true
  drawdown_governor:
    enabled: true
    caution_drawdown_pct: 0.015      # 1.5% DD -> CAUTION (0.70x risk)
    reduced_risk_drawdown_pct: 0.025 # 2.5% DD -> REDUCED_RISK (0.40x risk)
    defensive_drawdown_pct: 0.035    # 3.5% DD -> DEFENSIVE (0.20x risk)
    emergency_drawdown_pct: 0.050    # 5.0% DD -> EMERGENCY (0.00x risk)
  recovery_mode:
    enabled: true
    activation_drawdown_pct: 0.025   # Activate recovery mode at 2.5% DD
    deactivation_drawdown_pct: 0.010 # Return to normal when DD < 1.0%
    min_consecutive_wins_to_deactivate: 2
    position_size_multiplier: 0.50
    stricter_edge_multiplier: 1.25
    stricter_cooldown_multiplier: 1.50
  symbol_throttling:
    enabled: true
    lookback_trades: 10
    max_consecutive_losses: 2
    throttled_cooldown_seconds: 1800  # 30 min cooldown after 2 consecutive losses
    throttled_size_multiplier: 0.50
  exposure_limits:
    enabled: true
    max_gross_exposure_pct: 1.00     # 100% total gross exposure
    max_concurrent_positions: 2
    max_alt_exposure_pct: 0.50       # 50% max combined altcoin exposure
    max_alt_concurrent_positions: 1  # Max 1 altcoin at a time
    majors:
      - "BTC/USD"
      - "ETH/USD"

fees:
  maker_fee_pct: 0.0005   # 0.05% Limit/Maker
  taker_fee_pct: 0.0010   # 0.10% Market/Taker
  slippage_pct: 0.0002    # 0.02% estimated execution slippage

trailing_stop:
  breakeven_trigger_r: 1.0     # Move to breakeven after +1.0R
  trail_activation_r: 2.0      # Activate trailing stop after +2.0R
  atr_multiplier: 1.5          # ATR distance for dynamic trailing
  atr_period: 14

autosl:
  validation_window:
    validation_candles: 2
    candle_timeframe_seconds: 60
    min_expansion_percent: 1.0
    phase2_profit_activation: 2.0
  trailing_stop_loss:
    min_tick_buffer: 0.5
    tick_size: 0.1
    recalc_interval_seconds: 60.0
    profit_protection_tiers:
      - { profit_pct: 10.0, sl_percent: 0.4 }
      - { profit_pct: 5.0, sl_percent: 0.6 }
      - { profit_pct: 3.0, sl_percent: 0.9 }
      - { profit_pct: 1.5, sl_percent: 1.2 }
    hard_sl_trailing_step: 10.0
    hard_sl_step_usd:
      BTC/USD: 50.0
      ETH/USD: 4.0
      SOL/USD: 0.5
      SUI/USD: 0.01
      ADA/USD: 0.002
      FET/USD: 0.005
      ENA/USD: 0.002
      STO/USD: 0.001
      S/USD: 0.002
      PUMP/USD: 0.00001
      BONK/USD: 0.0000001
      PEPE/USD: 0.00000005
  momentum_extension:
    enabled: true
    fast_target_max_seconds: 180.0
    max_extensions: 3
    profit_lock_ratio: 0.50
    extreme_range_threshold_pct: 0.2


market_data:
  pairs:
    - "BTC/USD"
    - "ETH/USD"
    - "PEPE/USD"
    - "BONK/USD"
    - "STO/USD"
    - "FET/USD"
    - "PUMP/USD"
    - "ENA/USD"
    - "S/USD"
    - "ADA/USD"
    - "SOL/USD"
    - "SUI/USD"
  poll_interval_seconds: 2.0
  stale_data_threshold_seconds: 30.0
  primary_timeframe: "5m"
  context_timeframe: "15m"

regime_detection:
  lookback_periods: 50
  adx_trend_threshold: 25.0
  atr_period: 14
  volatility_high_percentile: 80.0
  volatility_low_percentile: 20.0

strategies:
  value_area:
    enabled: true
    volume_profile_fraction: 0.70  # 70% volume for Value Area
    lookback_candles: 72           # 6 hours of 5m bars
    min_risk_reward: 1.5
    tp1_allocation_pct: 0.50
    tp2_allocation_pct: 0.50

  liquidity_sweep:
    enabled: true
    swing_lookback: 20
    displacement_factor: 1.2       # Body size > 1.2 * ATR
    min_risk_reward: 2.0
    tp1_r_multiple: 2.0


audit:
  enable_hash_chain: true
  audit_file: "logs/audit_trail.jsonl"
  api_log_file: "logs/api_requests.jsonl"
  trade_log_file: "logs/trade_log.csv"
  max_log_bytes: 104857600  # 100 MB

web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  auth_token: ""
  broadcast_interval_seconds: 1.0

telegram:
  enabled: true
  bot_token: ""
  chat_id: ""


